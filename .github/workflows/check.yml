name: checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/build_plugins.py
      - run: uv run python scripts/build_plugins.py --hooks
      - run: uv run python scripts/smoke_release.py
      - run: uv run python scripts/build_marketplace.py
