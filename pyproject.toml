[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "labledger"
version = "0.1.0"
description = "Durable research workflows and experiment records for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.23,<5", "psutil>=6,<8"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/labledger"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README.md", "LabLedger_SPEC.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
